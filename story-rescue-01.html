<style>
*{box-sizing:border-box}body{margin:0;background:#eaf7ff;color:#29445b;font-family:system-ui,-apple-system,sans-serif}
header{text-align:center;padding:16px 12px 8px}header .brand{font-size:13px;font-weight:800;letter-spacing:1px;color:#54798d}
h1{font-size:25px;margin:5px}.progress{height:9px;background:#d4e7ef;border-radius:20px;max-width:560px;margin:12px auto;overflow:hidden}
.bar{height:100%;background:#77c8a0;width:0;transition:.3s}main{max-width:650px;margin:auto;padding:8px 14px 28px}
.scene{background:#fffdf5;border:2px solid #d9edf2;border-radius:25px;padding:14px;text-align:center;min-height:490px;box-shadow:0 7px #d7e9ed}
.chapter{display:inline-block;padding:5px 12px;border-radius:20px;background:#eaf4ff;color:#4d7189;font-size:13px;font-weight:800}
.picture{width:100%;height:auto;aspect-ratio:2.05/1;border-radius:18px;background:#e8f5fb;margin:10px 0;overflow:hidden}
.picture img{width:100%;height:100%;object-fit:contain;display:block}
h2{font-size:23px;margin:12px 0 8px}.story{font-size:16px;line-height:1.55;margin:8px 2px 12px;min-height:50px}
.dialogue{display:flex;align-items:flex-start;gap:10px;text-align:left;background:#f0f8ff;border:1px solid #d8eaf3;border-radius:17px;padding:11px 13px;margin:12px 0 14px;min-height:66px}
.avatar{font-size:30px;flex:0 0 38px}.speaker{font-size:12px;font-weight:800;color:#59829a;margin-bottom:3px}
.say{font-size:15px;line-height:1.45}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
.choice{background:white;border:2px solid #d7e9ed;border-radius:17px;padding:10px 4px;font-size:15px;font-weight:bold;color:#29445b;min-height:88px}
.choice span{display:block;font-size:34px;margin-bottom:4px}button{cursor:pointer;font:inherit}
.choice.correct{background:#effbf2;border-color:#70c59a}.choice.wrong{background:#fff0f0;border-color:#e9a2a2}
.primary,.secondary{border:0;border-radius:30px;padding:12px 18px;margin:5px;font-weight:bold}
.primary{background:#70c49b;color:#173e32}.secondary{background:#e5f1f5;color:#34566a}
.feedback{min-height:28px;color:#41845f;font-weight:bold;font-size:14px}canvas{width:100%;height:150px;border:2px dashed #b9d5df;border-radius:15px;background:white;touch-action:none}
.hint{font-size:13px;color:#668292}.story-note{font-size:12px;color:#78909c;margin-top:10px}
@media(max-width:380px){.scene{padding:10px}.choices{gap:6px}.choice{font-size:13px}}
</style>

{chapter:"숲속 마을 · 긴급 신고",title:"긴급 출동!",text:"평화롭던 숲속 마을에 긴급 신고가 들어왔어요. 아기 토끼가 보이지 않는대요!",speaker:"다람쥐 대장",avatar:"🐿️",line:"구조대 친구들! 아기 토끼가 사라졌어. 단서를 찾아 함께 구해 주자!",button:"🚨 구조대 출동!",type:"intro"},

let step=Number(localStorage.getItem("rescue01-step")||0);if(step<0||step>5)step=0;
let voiceOn=true,earned=localStorage.getItem("rescue01-earned")==="yes";
const el=id=>document.getElementById(id);
function speak(){if(!voiceOn||!("speechSynthesis"in window))return;speechSynthesis.cancel();const s=scenes[step],m=new SpeechSynthesisUtterance(s.title+". "+s.text+" "+s.speaker+". "+s.line);m.lang="ko-KR";speechSynthesis.speak(m);}
function advance(){if(step<5){step++;localStorage.setItem("rescue01-step",step);render();}}
function choices(items){const w=document.createElement("div");w.className="choices";items.forEach(([emoji,label,ok])=>{const b=document.createElement("button");b.className="choice";b.innerHTML="<span>"+emoji+"</span>"+label;b.onclick=()=>{if(ok){b.classList.add("correct");el("feedback").textContent="정답이야! 새로운 단서를 찾았어.";setTimeout(advance,850)}else{b.classList.add("wrong");el("feedback").textContent="아직 아니야. 그림을 다시 살펴보자!"}};w.appendChild(b)});el("task").appendChild(w)}
function drawing(){const c=el("pad"),ctx=c.getContext("2d");ctx.strokeStyle="#315b70";ctx.lineWidth=10;ctx.lineCap="round";let down=false,last=null;function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{down=true;last=pos(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;el("clear").onclick=()=>ctx.clearRect(0,0,c.width,c.height)}
function render(){const s=scenes[step];if("speechSynthesis"in window)speechSynthesis.cancel();el("picture").innerHTML='<img alt="별별 구조대 장면 '+(step+1)+'" src="'+art[step]+'">';el("chapter").textContent=s.chapter;el("heading").textContent=s.title;el("story").textContent=s.text;el("speaker").textContent=s.speaker;el("avatar").textContent=s.avatar;el("dialogueText").textContent=s.line;el("bar").style.width=((step+1)/6*100)+"%";el("feedback").textContent="";el("task").innerHTML="";el("next").textContent=s.button||"다음 장면";el("exit").style.display=s.type==="done"?"inline-block":"none";el("next").style.display=["pick","animal","draw"].includes(s.type)?"none":"inline-block";
if(s.type==="pick")choices([["🚂","기차",true],["🍎","사과",false],["🍌","바나나",false]]);
if(s.type==="animal")choices([["🦊","여우",false],["🐰","토끼",true],["🦉","부엉이",false]]);
if(s.type==="say"){el("task").innerHTML='<button class="secondary" id="listen">🔈 기역 소리 듣기</button><p class="hint">준비가 되면 아래 다음 장면을 눌러 주세요.</p>';el("listen").onclick=()=>{if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("기역");u.lang="ko-KR";speechSynthesis.speak(u)}}}
if(s.type==="draw"){el("task").innerHTML='<canvas id="pad" width="600" height="220"></canvas><p class="hint">손가락으로 ㄱ을 써 보세요.</p><button class="secondary" id="clear">다시 쓰기</button><button class="primary" id="drawDone">암호 완성!</button>';drawing();el("drawDone").onclick=advance}
if(s.type==="done"){if(!earned){localStorage.setItem("rescue01-earned","yes");earned=true;el("feedback").textContent="🌟 첫 구조 완료! 구조대 별 1개를 획득했어요!"}else el("feedback").textContent="🐰 다시 만나서 반가워! 구조대 임무를 완료했어요.";el("next").textContent="이야기 처음부터 다시 보기"}speak()}
el("next").onclick=()=>{if(step===5){step=0;localStorage.setItem("rescue01-step",0);render()}else advance()};
el("repeat").onclick=speak;el("voice").onclick=()=>{voiceOn=!voiceOn;el("voice").textContent=voiceOn?"🔊 음성 켜짐":"🔇 음성 꺼짐";if(!voiceOn&&"speechSynthesis"in window)speechSynthesis.cancel()};render();
</script><script src="assets/3d/emoji-3d.js" defer></script>
</body></html>
