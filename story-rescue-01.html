
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별별 구조대 01 - 사라진 아기 토끼</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf7ff;color:#29445b;font-family:system-ui,sans-serif}
header{text-align:center;padding:18px}
h1{font-size:27px;margin:6px}
.progress{height:9px;background:#d4e7ef;border-radius:20px;max-width:560px;margin:12px auto;overflow:hidden}
.bar{height:100%;background:#77c8a0;width:0;transition:.3s}
main{max-width:650px;margin:auto;padding:8px 16px 28px}
.scene{background:#fffdf5;border:2px solid #d9edf2;border-radius:25px;padding:20px 16px;text-align:center;min-height:420px;box-shadow:0 7px #d7e9ed}
.picture{height:170px;border-radius:18px;background:linear-gradient(#dff3ff 0 68%,#d9f0d1 68%);display:grid;place-items:center;font-size:75px}
h2{font-size:24px}
p{font-size:17px;line-height:1.6}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}
.choice{background:white;border:2px solid #d7e9ed;border-radius:17px;padding:12px 4px;font-size:16px;font-weight:bold;color:#29445b}
.choice span{display:block;font-size:36px;margin-bottom:5px}
button{cursor:pointer;font:inherit}
.choice.correct{background:#effbf2;border-color:#70c59a}
.choice.wrong{background:#fff0f0;border-color:#e9a2a2}
.primary,.secondary{border:0;border-radius:30px;padding:12px 20px;margin:5px;font-weight:bold}
.primary{background:#70c49b;color:#173e32}
.secondary{background:#e5f1f5;color:#34566a}
.feedback{min-height:28px;color:#41845f;font-weight:bold}
canvas{width:100%;height:160px;border:2px dashed #b9d5df;border-radius:15px;background:white;touch-action:none}
.hint{font-size:13px;color:#668292}
</style>
</head>
<body>
<header>
<div>⭐ YUMIN'S STAR RESCUE TEAM</div>
<h1>별별 구조대 01</h1>
<div>사라진 아기 토끼</div>
<div class="progress"><div class="bar" id="bar"></div></div>
</header>
<main>
<section class="scene">
<div class="picture" id="picture">🚓</div>
<h2 id="heading">긴급 출동!</h2>
<p id="story">숲속 마을에서 아기 토끼가 사라졌대요. 별별 구조대, 출동 준비!</p>
<div id="task"></div>
<div class="feedback" id="feedback"></div>
<div>
<button class="secondary" id="voice">🔊 음성 켜짐</button>
<button class="secondary" id="repeat">다시 듣기</button>
<button class="primary" id="next">🚨 출동하기</button>
</div>
</section>
</main>
<script>
const scenes=[
{emoji:"🚓",title:"긴급 출동!",text:"숲속 마을에서 아기 토끼가 사라졌대요. 별별 구조대, 출동 준비!",button:"🚨 출동하기"},
{emoji:"🚂 🍎 🍌",title:"ㄱ을 찾아라!",text:"기역 소리가 나는 그림을 찾아볼까요? 기차, 사과, 바나나 중에서 골라요.",type:"pick"},
{emoji:"🗣️",title:"ㄱ 소리 말하기",text:"기역! 입으로 천천히 말해 보세요. 듣고 따라 해도 괜찮아요.",type:"say"},
{emoji:"✏️",title:"ㄱ 따라 쓰기",text:"손가락이나 펜으로 ㄱ을 그려 보세요. 위에서 오른쪽으로, 아래로 내려와요.",type:"draw"},
{emoji:"🌳 🐰",title:"아기 토끼를 찾아라!",text:"풀숲에 누가 숨어 있을까요? 아기 토끼를 찾아 눌러 주세요.",type:"animal"},
{emoji:"🐰 ⭐",title:"구조 성공!",text:"아기 토끼를 무사히 찾았어요! 별별 구조대가 임무를 완수했어요.",type:"done"}
];
let step=Number(localStorage.getItem("rescue01-step")||0);
if(step<0||step>5)step=0;
let voiceOn=true;
let earned=localStorage.getItem("rescue01-earned")==="yes";
const el=id=>document.getElementById(id);
function speak(){
if(!voiceOn||!("speechSynthesis"in window))return;
speechSynthesis.cancel();
speechSynthesis.speak(new SpeechSynthesisUtterance(scenes[step].title+". "+scenes[step].text));
}
function choices(items){
const wrap=document.createElement("div");
wrap.className="choices";
items.forEach(([emoji,label,correct])=>{
const b=document.createElement("button");
b.className="choice";
b.innerHTML="<span>"+emoji+"</span>"+label;
b.onclick=()=>{
if(correct){
b.classList.add("correct");
el("feedback").textContent="정답이에요! 잘 찾았어요.";
setTimeout(advance,650);
}else{
b.classList.add("wrong");
el("feedback").textContent="괜찮아요. 다시 살펴봐요!";
}
};
wrap.appendChild(b);
});
el("task").appendChild(wrap);
}
function drawing(){
const c=el("pad"),ctx=c.getContext("2d");
ctx.strokeStyle="#315b70";ctx.lineWidth=10;ctx.lineCap="round";
let down=false,last=null;
function pos(e){
const r=c.getBoundingClientRect();
return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};
}
c.onpointerdown=e=>{down=true;last=pos(e);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{
if(!down)return;
let p=pos(e);
ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;
};
c.onpointerup=()=>down=false;
el("clear").onclick=()=>ctx.clearRect(0,0,c.width,c.height);
}
function render(){
const s=scenes[step];
el("picture").textContent=s.emoji;
el("heading").textContent=s.title;
el("story").textContent=s.text;
el("bar").style.width=((step+1)/6*100)+"%";
el("feedback").textContent="";
el("task").innerHTML="";
el("next").textContent=s.button||"다음 단계";
el("next").style.display=["pick","animal","draw"].includes(s.type)?"none":"inline-block";
if(s.type==="pick")choices([["🚂","기차",true],["🍎","사과",false],["🍌","바나나",false]]);
if(s.type==="animal")choices([["🦊","여우",false],["🐰","토끼",true],["🦉","부엉이",false]]);
if(s.type==="say"){
el("task").innerHTML='<button class="secondary" id="listen">🔈 기역 듣기</button><p class="hint">마이크 없이도 진행할 수 있어요.</p>';
el("listen").onclick=()=>{if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance("기역"))};
}
if(s.type==="draw"){
el("task").innerHTML='<canvas id="pad" width="600" height="220"></canvas><p class="hint">손가락으로 ㄱ을 써 보세요.</p><button class="secondary" id="clear">지우기</button>';
drawing();
}
if(s.type==="done"){
if(!earned){localStorage.setItem("rescue01-earned","yes");earned=true}
el("feedback").textContent="🌟 첫 구조 완료! 별 1개 획득!";
el("next").textContent="처음부터 다시 보기";
}
speak();
}
function advance(){
if(step<5){step++;localStorage.setItem("rescue01-step",step);render()}
else{step=0;localStorage.setItem("rescue01-step",0);render()}
}
el("next").onclick=()=>{
if(step===5){step=0;localStorage.setItem("rescue01-step",0);render()}
else advance();
};
el("repeat").onclick=speak;
el("voice").onclick=()=>{
voiceOn=!voiceOn;
el("voice").textContent=voiceOn?"🔊 음성 켜짐":"🔇 음성 꺼짐";
if(!voiceOn&&"speechSynthesis"in window)speechSynthesis.cancel();
};
render();
</script>
</body>
</html>
