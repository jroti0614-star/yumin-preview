<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf7ff"><title>별별 구조대 04 · 멈춰 버린 꼬마 기차</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf7ff;color:#29445b;font-family:system-ui,-apple-system,sans-serif}header{text-align:center;padding:15px 12px 8px}.brand{font-size:12px;font-weight:800;letter-spacing:1px;color:#54798d}h1{font-size:23px;margin:6px}.progress{height:9px;background:#d4e7ef;border-radius:20px;max-width:560px;margin:12px auto;overflow:hidden}.bar{height:100%;background:#77c8a0;width:0;transition:.3s}main{max-width:650px;margin:auto;padding:8px 14px 28px}.scene{background:#fffdf5;border:2px solid #d9edf2;border-radius:24px;padding:16px;text-align:center;min-height:470px;box-shadow:0 7px #d7e9ed}.chapter{display:inline-block;padding:5px 12px;border-radius:20px;background:#eaf4ff;color:#4d7189;font-size:13px;font-weight:800}.picture{height:170px;border-radius:18px;background:linear-gradient(#dff3ff 0 68%,#d9f0d1 68%);display:grid;place-items:center;font-size:76px;margin:10px 0}h2{font-size:22px;margin:12px 0 8px}.story{font-size:16px;line-height:1.55;min-height:54px}.dialogue{display:flex;gap:10px;text-align:left;background:#f0f8ff;border:1px solid #d8eaf3;border-radius:16px;padding:11px;margin:12px 0}.avatar{font-size:30px}.speaker{font-size:12px;font-weight:800;color:#59829a}.say{font-size:15px;line-height:1.45}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.choice{background:white;border:2px solid #d7e9ed;border-radius:15px;padding:12px 5px;min-height:68px;font-size:15px;font-weight:bold;color:#29445b}.choice.correct{background:#effbf2;border-color:#70c59a}.choice.wrong{background:#fff0f0;border-color:#e9a2a2}button{cursor:pointer;font:inherit}.primary,.secondary{border:0;border-radius:30px;padding:12px 18px;margin:5px;font-weight:bold}.primary{background:#70c49b;color:#173e32}.secondary{background:#e5f1f5;color:#34566a}.feedback{min-height:28px;color:#41845f;font-weight:bold;font-size:14px}.hint{font-size:13px;color:#668292}.home{display:inline-block;margin:18px 0;color:#52788d;text-decoration:none}@media(max-width:380px){.scene{padding:12px}.picture{height:150px}.choices{gap:5px}.choice{font-size:13px}}</style></head><body><header><div class="brand">⭐ YUMIN'S STAR RESCUE TEAM</div><h1>별별 구조대 04화</h1><div>멈춰 버린 꼬마 기차</div><div class="progress"><div class="bar" id="bar"></div></div></header><main><section class="scene"><div class="chapter" id="chapter"></div><div class="picture" id="picture"></div><h2 id="heading"></h2><p class="story" id="story"></p><div class="dialogue"><div class="avatar" id="avatar">🚓</div><div><div class="speaker" id="speaker"></div><div class="say" id="line"></div></div></div><div id="task"></div><div class="feedback" id="feedback"></div><button class="secondary" id="voice">🔊 음성 켜짐</button><button class="secondary" id="repeat">다시 듣기</button><button class="primary" id="next">출동하기</button><button class="secondary" id="exit" style="display:none" onclick="location.href='stories.html'">🏁 이야기 종료</button><p class="hint">이야기를 듣고 미션을 해결해 다음 장면으로 가요.</p></section><a class="home" href="stories.html">← 이야기 목록으로</a></main><script>const scenes=[{"chapter":"기차가 멈췄어요","text":"숲속 역의 꼬마 기차가 신호를 기다리고 있어요.","speaker":"기관사","line":"색깔 신호를 확인해야 출발할 수 있어!","emoji":"🚂","choices":null},{"chapter":"첫 번째 신호 · 빨강","text":"신호등에서 빨간색 불빛을 찾아야 해요.","speaker":"삐뽀","line":"빨간색은 어떤 색깔일까?","emoji":"🚦","choices":["🔴 빨강","🔵 파랑","🟡 노랑"],"answer":0},{"chapter":"두 번째 신호 · 파랑","text":"이번에는 파란 깃발을 찾아야 해요.","speaker":"기관사","line":"파란색을 골라 줘!","emoji":"🚩","choices":["🔴 빨강","🔵 파랑","🟡 노랑"],"answer":1},{"chapter":"세 번째 신호 · 노랑","text":"마지막 노란 별 표지판을 찾았어요.","speaker":"씽씽","line":"노란색은 어느 것일까?","emoji":"⭐","choices":["🔴 빨강","🔵 파랑","🟡 노랑"],"answer":2},{"chapter":"출발 성공!","text":"세 가지 색깔 신호를 모두 찾았어요. 기차가 안전하게 출발하고 별 조각을 얻었어요!","speaker":"기관사","line":"칙칙폭폭! 유민이 덕분이야!","emoji":"🌟","choices":null}];const id=x=>document.getElementById(x);const key="rescue04-step";let step=+(localStorage.getItem(key)||0);if(step<0||step>=scenes.length)step=0;let voice=true;function say(){if(!voice||!("speechSynthesis"in window))return;speechSynthesis.cancel();let s=scenes[step];let u=new SpeechSynthesisUtterance(s.chapter+". "+s.text+" "+s.speaker+". "+s.line);u.lang="ko-KR";speechSynthesis.speak(u)}function advance(){if(step<scenes.length-1){step++;localStorage.setItem(key,step);render()}}function render(){let s=scenes[step];if("speechSynthesis"in window)speechSynthesis.cancel();id("chapter").textContent=s.chapter;id("heading").textContent=s.chapter;id("story").textContent=s.text;id("speaker").textContent=s.speaker;id("line").textContent=s.line;id("avatar").textContent=s.emoji;id("picture").textContent=s.emoji;id("bar").style.width=((step+1)/scenes.length*100)+"%";id("feedback").textContent="";id("task").innerHTML="";id("next").style.display="inline-block";id("exit").style.display=step===scenes.length-1?"inline-block":"none";id("next").textContent=step===0?"🚨 출동하기":step===scenes.length-1?"처음부터 다시 보기":"다음 장면";if(s.choices){id("next").style.display="none";let w=document.createElement("div");w.className="choices";s.choices.forEach((v,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>{if(i===s.answer){b.classList.add("correct");id("feedback").textContent="정답이야! 단서를 찾았어.";w.querySelectorAll("button").forEach(x=>x.disabled=true);setTimeout(advance,850)}else{id("feedback").textContent="다시 한 번 생각해 보자!";b.classList.add("wrong")}};w.appendChild(b)});id("task").appendChild(w)}if(step===scenes.length-1){let stars=JSON.parse(localStorage.getItem("rescue-stars")||"[]");if(!stars.includes(4)){stars.push(4);localStorage.setItem("rescue-stars",JSON.stringify(stars))}id("feedback").textContent="🌟 임무 완료! 별빛 지도 조각을 획득했어요!";id("next").textContent="이야기 다시 보기"}say()}id("next").onclick=()=>{if(step===scenes.length-1){step=0;localStorage.setItem(key,0);render()}else advance()};id("repeat").onclick=say;id("voice").onclick=()=>{voice=!voice;id("voice").textContent=voice?"🔊 음성 켜짐":"🔇 음성 꺼짐";if(!voice&&"speechSynthesis"in window)speechSynthesis.cancel()};render();</script></body></html>
