<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf7ff"><title>별별 구조대 10 · 별빛 마을의 마지막 구조 작전</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf7ff;color:#29445b;font-family:system-ui,-apple-system,sans-serif}header{text-align:center;padding:15px 12px 8px}.brand{font-size:12px;font-weight:800;letter-spacing:1px;color:#54798d}h1{font-size:23px;margin:6px}.progress{height:9px;background:#d4e7ef;border-radius:20px;max-width:560px;margin:12px auto;overflow:hidden}.bar{height:100%;background:#77c8a0;width:0;transition:.3s}main{max-width:650px;margin:auto;padding:8px 14px 28px}.scene{background:#fffdf5;border:2px solid #d9edf2;border-radius:24px;padding:16px;text-align:center;min-height:470px;box-shadow:0 7px #d7e9ed}.chapter{display:inline-block;padding:5px 12px;border-radius:20px;background:#eaf4ff;color:#4d7189;font-size:13px;font-weight:800}.picture{height:220px;border-radius:22px;background:linear-gradient(180deg,#a8ddff 0%,#dff4ff 58%,#b9dfa8 59%,#80bd83 100%);display:grid;place-items:center;font-size:104px;margin:12px 0;position:relative;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 -12px 24px #397b5830,0 5px 0 #c9e1e9;isolation:isolate;text-shadow:0 5px 10px #355b5b40;animation:sceneIn .35s ease-out}.picture:before{content:"";position:absolute;z-index:-1;width:180px;height:180px;border-radius:50%;background:#fff8;top:-105px;right:-35px;filter:blur(2px)}.picture:after{content:"✦  ✧  ✦";position:absolute;z-index:-1;left:12px;bottom:10px;color:#fff9;font-size:24px;letter-spacing:14px}.picture.forest{background:linear-gradient(180deg,#9bd8ff 0%,#e6f7ff 54%,#b9e6a2 55%,#65ad70 100%)}.picture.fire{background:linear-gradient(180deg,#9bd8ff 0%,#f6f0dc 58%,#f5bd83 59%,#d97858 100%)}.picture.train{background:linear-gradient(180deg,#a6dfff 0%,#f4faff 58%,#b7d8a8 59%,#77a982 100%)}.picture.night{background:linear-gradient(180deg,#172b62 0%,#354d8b 58%,#6479a0 59%,#263d59 100%)}.picture.sky{background:linear-gradient(180deg,#64bfff 0%,#eaf8ff 66%,#c8e9fa 67%,#8ec8e8 100%)}.picture.clinic{background:linear-gradient(180deg,#b7e5ff 0%,#f7fbff 60%,#c4e7d5 61%,#8bc9a8 100%)}.picture.rainbow{background:linear-gradient(180deg,#7fcaff 0%,#f1fbff 64%,#c9e7ff 65%,#9dc9ef 100%)}.picture.village{background:linear-gradient(180deg,#182858 0%,#5d5a9b 57%,#e8b5a2 58%,#8f7792 100%)}@keyframes sceneIn{from{opacity:.65;transform:scale(.97)}to{opacity:1;transform:scale(1)}}h2{font-size:22px;margin:12px 0 8px}.story{font-size:16px;line-height:1.55;min-height:54px}.dialogue{display:flex;gap:10px;text-align:left;background:#f0f8ff;border:1px solid #d8eaf3;border-radius:16px;padding:11px;margin:12px 0}.avatar{font-size:30px}.speaker{font-size:12px;font-weight:800;color:#59829a}.say{font-size:15px;line-height:1.45}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.choice{background:white;border:2px solid #d7e9ed;border-radius:15px;padding:12px 5px;min-height:68px;font-size:15px;font-weight:bold;color:#29445b}.choice.correct{background:#effbf2;border-color:#70c59a}.choice.wrong{background:#fff0f0;border-color:#e9a2a2}button{cursor:pointer;font:inherit}.primary,.secondary{border:0;border-radius:30px;padding:12px 18px;margin:5px;font-weight:bold}.primary{background:#70c49b;color:#173e32}.secondary{background:#e5f1f5;color:#34566a}.feedback{min-height:28px;color:#41845f;font-weight:bold;font-size:14px}.hint{font-size:13px;color:#668292}.home{display:inline-block;margin:18px 0;color:#52788d;text-decoration:none}@media(max-width:380px){.scene{padding:12px}.picture{height:150px}.choices{gap:5px}.choice{font-size:13px}}</style><link rel="stylesheet" href="assets/3d/emoji-3d.css">
<script src="assets/3d/tts-safe.js"></script>

</head><body><header><div class="brand">⭐ YUMIN'S STAR RESCUE TEAM</div><h1>별별 구조대 10화</h1><div>별빛 마을의 마지막 구조 작전</div><div class="progress"><div class="bar" id="bar"></div></div></header><main><section class="scene"><div class="chapter" id="chapter"></div><div class="picture" id="picture"></div><h2 id="heading"></h2><p class="story" id="story"></p><div class="dialogue"><div class="avatar" id="avatar">🚓</div><div><div class="speaker" id="speaker"></div><div class="say" id="line"></div></div></div><div id="task"></div><div class="feedback" id="feedback"></div><button class="secondary" id="voice">🔊 음성 켜짐</button><button class="secondary" id="repeat">다시 듣기</button><button class="primary" id="next">출동하기</button><button class="secondary" id="exit" style="display:none" onclick="location.href='index.html#learnSection'">📚 학습으로 이어가기</button><p class="hint">이야기를 듣고 미션을 해결해 다음 장면으로 가요.</p></section><a class="home" href="stories.html">← 이야기 목록으로</a></main><script>const scenes=[{"chapter":"마지막 긴급 신고","text":"별빛 마을의 커다란 별등이 꺼졌어요. 구조대가 모두 모였어요.","speaker":"대장","line":"유민이, 우리가 모은 단서로 별등을 다시 밝혀 보자!","emoji":"🚨","choices":null},{"chapter":"첫 번째 미션 · 글자","text":"별등을 켜려면 ㄱ, ㄴ, ㄷ 중 ㄷ을 찾아야 해요.","speaker":"삐뽀","line":"ㄷ을 골라 줘!","emoji":"🔤","choices":["ㄱ","ㄴ","ㄷ"],"answer":2},{"chapter":"두 번째 미션 · 숫자","text":"별등에 별 세 개를 꽂아야 해요.","speaker":"씽씽","line":"별 세 개를 뜻하는 숫자는 무엇일까?","emoji":"⭐","choices":["1","2","3"],"answer":2},{"chapter":"세 번째 미션 · 모양","text":"마지막 열쇠는 세모 모양이에요.","speaker":"부엉이","line":"세모 모양을 찾아 줘!","emoji":"🔺","choices":["동그라미","세모","네모"],"answer":1},{"chapter":"별빛 마을 구출 성공!","text":"마을의 별등이 환하게 켜졌어요! 열 개의 모험을 완수한 유민이에게 황금 별 배지가 주어졌어요.","speaker":"모두","line":"유민이는 우리 별별 구조대의 멋진 대장이야!","emoji":"🏆","choices":null}];const id=x=>document.getElementById(x);const key="rescue10-step";let step=+(localStorage.getItem(key)||0);if(step<0||step>=scenes.length)step=0;let voice=true;function sceneTheme(s){const t=s.chapter+" "+s.text;if(/소방|불꽃|연기|호스/.test(t))return "fire";if(/기차|신호|기관사|역/.test(t))return "train";if(/별빛|별등|별 조각|밤|마을/.test(t))return "night";if(/헬기|하늘|비행/.test(t))return "sky";if(/곰|병원|아픈|치료/.test(t))return "clinic";if(/무지개|다리|구름/.test(t))return "rainbow";if(/마지막|마을/.test(t))return "village";return "forest"}function say(){if(!voice||!("speechSynthesis"in window))return;speechSynthesis.cancel();let s=scenes[step];let u=new SpeechSynthesisUtterance(s.chapter+". "+s.text+" "+s.speaker+". "+s.line);u.lang="ko-KR";speechSynthesis.speak(u)}function advance(){if(step<scenes.length-1){step++;localStorage.setItem(key,step);render()}}function render(){let s=scenes[step];if("speechSynthesis"in window)speechSynthesis.cancel();id("chapter").textContent=s.chapter;id("heading").textContent=s.chapter;id("story").textContent=s.text;id("speaker").textContent=s.speaker;id("line").textContent=s.line;id("avatar").textContent=s.emoji;id("picture").textContent=s.emoji;id("picture").className="picture "+sceneTheme(s);id("bar").style.width=((step+1)/scenes.length*100)+"%";id("feedback").textContent="";id("task").innerHTML="";id("next").style.display="inline-block";id("exit").style.display=step===scenes.length-1?"inline-block":"none";id("next").textContent=step===0?"🚨 출동하기":step===scenes.length-1?"처음부터 다시 보기":"다음 장면";if(s.choices){id("next").style.display="none";let w=document.createElement("div");w.className="choices";s.choices.forEach((v,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>{if(i===s.answer){b.classList.add("correct");id("feedback").textContent="정답이야! 단서를 찾았어.";w.querySelectorAll("button").forEach(x=>x.disabled=true);setTimeout(advance,850)}else{id("feedback").textContent="다시 한 번 생각해 보자!";b.classList.add("wrong")}};w.appendChild(b)});id("task").appendChild(w)}if(step===scenes.length-1){let stars=JSON.parse(localStorage.getItem("rescue-stars")||"[]");if(!stars.includes(10)){stars.push(10);localStorage.setItem("rescue-stars",JSON.stringify(stars))}id("feedback").textContent="🌟 임무 완료! 별빛 지도 조각을 획득했어요!";id("next").textContent="이야기 다시 보기"}say()}id("next").onclick=()=>{if(step===scenes.length-1){step=0;localStorage.setItem(key,0);render()}else advance()};id("repeat").onclick=say;id("voice").onclick=()=>{voice=!voice;id("voice").textContent=voice?"🔊 음성 켜짐":"🔇 음성 꺼짐";if(!voice&&"speechSynthesis"in window)speechSynthesis.cancel()};render();</script><script src="assets/3d/emoji-3d.js" defer></script>
</body></html>
